<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Nombres</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <div class="card centrado">
        <form action="/ejercicio2" method="POST">
            <div class="form-group">
                <label for="nombre1">Nombre 1:</label>
                <input type="text" id="nombre1" name="nombre1" value="{{ nombre1 if nombre1 else '' }}" required>
            </div>
            <div class="form-group">
                <label for="nombre2">Nombre 2:</label>
                <input type="text" id="nombre2" name="nombre2" value="{{ nombre2 if nombre2 else '' }}" required>
            </div>
            <div class="form-group">
                <label for="nombre3">Nombre 3:</label>
                <input type="text" id="nombre3" name="nombre3" value="{{ nombre3 if nombre3 else '' }}" required>
            </div>
            <button type="submit" class="btn-enviar">Enviar</button>
        </form>

        {% if nombre_mayor %}
        <div class="resultado-serif">
            <p>El nombre con mayor cantidad de caracteres es : {{ nombre_mayor }}</p>
            <p>El nombre tiene : {{ cantidad_caracteres }} caracteres</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
