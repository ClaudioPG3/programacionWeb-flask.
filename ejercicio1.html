<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Formulario de Notas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
    <div class="card">
        <h2>Formulario de Notas</h2>
        <form action="/ejercicio1" method="POST">
            <div class="form-group">
                <label for="nota1">Nota 1:</label>
                <input type="number" id="nota1" name="nota1" min="10" max="70" step="any" value="{{ nota1 if nota1 is not none else '' }}" required>
            </div>
            <div class="form-group">
                <label for="nota2">Nota 2:</label>
                <input type="number" id="nota2" name="nota2" min="10" max="70" step="any" value="{{ nota2 if nota2 is not none else '' }}" required>
            </div>
            <div class="form-group">
                <label for="nota3">Nota 3:</label>
                <input type="number" id="nota3" name="nota3" min="10" max="70" step="any" value="{{ nota3 if nota3 is not none else '' }}" required>
            </div>
            <div class="form-group">
                <label for="asistencia">Asistencia (%):</label>
                <input type="number" id="asistencia" name="asistencia" min="0" max="100" step="any" value="{{ asistencia if asistencia is not none else '' }}" required>
            </div>
            <button type="submit" class="btn-enviar">Enviar</button>
        </form>

        {% if promedio is not none %}
        <div class="resultado">
            <p>{{ promedio }}</p>
            <p>{{ estado }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
